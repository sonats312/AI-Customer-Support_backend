spring.application.name=AI-Customer-Support
server.port=8080

# MySQL Database

#spring.datasource.url=jdbc:mysql://localhost:3306/customerSupport_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.url=jdbc:mysql://localhost:3306/customer_support
#spring.datasource.username=root
#spring.datasource.password=root
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Actuator

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Swagger / OpenAPI

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

#Security
#security.jwt.secret=my-super-secret-key-for-ai-customer-support-project-2026
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=86400000

# Logging Levels

# Application logging
logging.level.com.ai.customer.support=INFO
# Spring Web logging
logging.level.org.springframework.web=INFO
# Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG
# Hibernate parameter binding
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Log file
logging.file.name=logs/ai-customer-support.log
# Log pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Spring AI / OpenAI

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.6-flash

